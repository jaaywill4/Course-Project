services: 
  web1:
    build: ./app
    ports:
      - "3001:3000"
    depends_on:
      - redis

  web2:
    build: ./app
    ports:
      - "3002:3000"
    depends_on:
      - redis

  web3:
    build : ./app
    ports:
      - "3003:3000"
    depends_on:
      - redis

  redis: 
    image: redis:7-alpine
    ports:
      - "6379:6379"

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web1
      - web2
      - web3
