apiVersion: v1
kind: ConfigMap
metadata:
  name: course-project-nginx-config
data:
  default.conf: |
    upstream nodejs_backend {
        server course-project-nodejs:3000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://nodejs_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
