events{}

http {
    upstream node_servers {
        server web1:3000;
        server web2:3000;
        server web3:3000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://node_servers;
            add_header X-Upstream-Server $upstream_addr always;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}