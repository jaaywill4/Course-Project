apiVersion: apps/v1
kind: Deployment
metadata:
  name: course-project-nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: course-project-nginx
  template:
    metadata:
      labels:
        app: course-project-nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.27.5-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: nginx-config
          configMap:
            name: course-project-nginx-config
