apiVersion: apps/v1
kind: Deployment
metadata:
  name: course-project-nodejs
spec:
  replicas: 3
  selector:
    matchLabels:
      app: course-project-nodejs
  template:
    metadata:
      labels:
        app: course-project-nodejs
    spec:
      volumes:
        - name: app-logs
          emptyDir: {}

      containers:
        - name: nodejs
          image: jaywill4/course-project-web:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: REDIS_URL
              value: "redis://redis:6379"

        - name: log-sidecar
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              while true; do
                echo "$(date) - Node.js Pod is running"
                sleep 10
              done
          volumeMounts:
            - name: app-logs
              mountPath: /logs
